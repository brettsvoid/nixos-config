# Standalone matugen config: renders ~/.config/edgebar/palette.json (light +
# dark) from palette.json.tmpl, then pings edgebar's theme.sock. Not used by
# `generate-edgebar-theme` (edgebar.nix), which writes its own config around
# the same template.
[config]

[templates.edgebar]
input_path = "palette.json.tmpl"
output_path = "~/.config/edgebar/palette.json"
post_hook = "nc -U \"$HOME/.cache/edgebar/theme.sock\" </dev/null 2>/dev/null || true"
