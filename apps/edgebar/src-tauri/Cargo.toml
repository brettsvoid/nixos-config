[package]
name = "edgebar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin's (a Windows
# issue: https://github.com/rust-lang/cargo/issues/8519).
name = "edgebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CPU/RAM/disk/swap for the notch's metrics view, and the CPU pill's
# top-process lookup.
sysinfo = "0.37"
# The notification history: a read-only copy of the system notification store
# (SQLite, WAL mode), and the binary plists in its records.
rusqlite = { version = "0.40", features = ["bundled"] }
plist = "1.9"
# Decode, resize and encode wallpapers for Tint (wallpapers.rs). No HEIC.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Turn and session ids for the Assistant tab. Already in the tree through tauri.
uuid = { version = "1", features = ["v4"] }

# Native macOS: AppKit windows, events and icons, and the frame window drawn
# with CAShapeLayer. Pinned to the objc2 0.3 crates tao/wry already pull in.
[target.'cfg(target_os = "macos")'.dependencies]
# mach `host_statistics` for the CPU pill's system/user split (sysinfo has no
# such breakdown), and `proc_pidinfo` for the notch's audio-source lookup.
libc = "0.2"
objc2 = "0.6"
# Objective-C blocks for the NSEvent cursor monitors that drive bar click-through.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSGeometry",
  "NSString",
  "NSNotification",
  "NSDistributedNotificationCenter",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSWindow",
  "NSResponder",
  "NSView",
  "NSEvent",
  "NSColor",
  "NSScreen",
  "NSBezierPath",
  "NSGraphics",
  "NSWorkspace",
  "NSRunningApplication",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
] }
objc2-quartz-core = { version = "0.3", features = [
  "CAGradientLayer",
  "CALayer",
  "CAShapeLayer",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
# CGWindow: the on-screen window list that shows when an app has taken a whole
# display (native fullscreen), so the bar and frame can hide. Reading
# bounds/layer needs no screen-recording permission. The bitmap and image
# features are for the debug socket's snapshot (devtools.rs).
objc2-core-graphics = { version = "0.3", features = [
  "CGColor",
  "CGPath",
  "CGWindow",
  "CGGeometry",
  "CGBitmapContext",
  "CGContext",
  "CGImage",
  "CGColorSpace",
] }
# The debug socket's snapshot of the bar WebView (devtools.rs).
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKWebView",
  "WKSnapshotConfiguration",
] }
objc2-core-foundation = { version = "0.3", features = [
  "CFCGTypes",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }

# SCNetworkReachability: pushes a network update on route/interface/VPN
# changes instead of polling. core-foundation 0.9 matches the run-loop types
# system-configuration 0.7 expects (separate from objc2-core-foundation).
system-configuration = "0.7"
core-foundation = "0.9"

[dev-dependencies]
# A mock app, so wallpapers.rs can drive `converge` without the real bar.
tauri = { version = "2", features = ["test"] }

# Tint decodes, resizes and re-encodes a multi-megapixel wallpaper. These
# crates at the dev profile's opt-level 0 are an order of magnitude slower than
# in release, which would make the dev bar's Tint miss its few-second budget.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
