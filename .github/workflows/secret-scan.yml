# Backstop scanning: catches anything committed with `git commit --no-verify`
# past the local pre-commit hooks. A finding fails the run.
name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # On `push`, gitleaks-action scans only the pushed commits; `schedule` and
  # `workflow_dispatch` rescan the whole history, so rule changes reach old
  # commits too.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for gitleaks detect

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    name: semgrep (custom rules + auto)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run semgrep (custom rules)
        run: semgrep --config .semgrep.yml --error --quiet .

      - name: Run semgrep auto (community rulesets)
        run: semgrep --config auto --error --quiet --severity ERROR .

      - name: Run semgrep OWASP Top Ten
        run: semgrep --config p/owasp-top-ten --error --quiet --severity ERROR .

  pre-commit:
    name: pre-commit (nix flake check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run pre-commit hooks via flake build
        # Builds only the pre-commit check. `nix flake check` would also
        # evaluate every nixosConfiguration, which is slow on the runner.
        run: |
          nix build .#checks.x86_64-linux.pre-commit \
            --print-build-logs --no-link
